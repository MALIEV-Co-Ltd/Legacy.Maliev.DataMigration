apiVersion: v1
kind: ServiceAccount
metadata:
  name: legacy-data-migration-shadow-provisioner
  namespace: maliev-legacy
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: legacy-data-migration-shadow-provisioner
  namespace: maliev-legacy
rules:
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["databases"]
    verbs: ["get", "create", "patch", "delete"]
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters"]
    resourceNames: ["legacy-postgres-main"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: legacy-data-migration-shadow-provisioner
  namespace: maliev-legacy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: legacy-data-migration-shadow-provisioner
subjects:
  - kind: ServiceAccount
    name: legacy-data-migration-shadow-provisioner
    namespace: maliev-legacy
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: legacy-data-migration-shadow-databases
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["postgresql.cnpg.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["databases", "databases/status"]
  matchConditions:
    - name: migration-identity-or-shadow-object
      expression: "request.userInfo.username == 'system:serviceaccount:maliev-legacy:legacy-data-migration-shadow-provisioner' || (object != null && (object.metadata.name.startsWith('legacy-shadow-') || object.spec.name.startsWith('legacy_shadow_'))) || (oldObject != null && (oldObject.metadata.name.startsWith('legacy-shadow-') || oldObject.spec.name.startsWith('legacy_shadow_')))"
  validations:
    - expression: "request.namespace == 'maliev-legacy'"
      message: Migration Database mutations are restricted to the maliev-legacy namespace.
    - expression: "request.userInfo.username == 'system:serviceaccount:maliev-legacy:legacy-data-migration-shadow-provisioner' || (request.userInfo.username == 'system:serviceaccount:maliev-legacy:legacy-postgres-main' && request.operation == 'UPDATE')"
      message: Only the dedicated migration identity or the exact CloudNativePG instance manager may perform its restricted update on legacy shadow resources.
    - expression: "request.userInfo.username != 'system:serviceaccount:maliev-legacy:legacy-postgres-main' || (request.operation == 'UPDATE' && object != null && oldObject != null && object.spec == oldObject.spec && object.metadata.labels == oldObject.metadata.labels && object.metadata.annotations == oldObject.metadata.annotations && ((!has(object.metadata.ownerReferences) && !has(oldObject.metadata.ownerReferences)) || (has(object.metadata.ownerReferences) && has(oldObject.metadata.ownerReferences) && object.metadata.ownerReferences == oldObject.metadata.ownerReferences)) && (has(object.metadata.finalizers) ? object.metadata.finalizers.filter(finalizer, finalizer != 'cnpg.io/deleteDatabase') : []) == (has(oldObject.metadata.finalizers) ? oldObject.metadata.finalizers.filter(finalizer, finalizer != 'cnpg.io/deleteDatabase') : []))"
      message: The CloudNativePG instance manager may update only status and its exact cnpg.io/deleteDatabase finalizer on an otherwise unchanged fenced shadow resource.
    - expression: "(object == null ? oldObject : object).metadata.name.matches('^legacy-shadow-[a-z0-9-]+-[0-9a-f]{32}$') && (object == null ? oldObject : object).spec.name.matches('^legacy_shadow_[a-z0-9_]+_[0-9a-f]{32}$')"
      message: Only exact run-owned shadow Database resources are permitted.
    - expression: "(object == null ? oldObject : object).metadata.name.matches('^legacy-shadow-[a-z0-9-]+-[0-9a-f]{32}$')"
      message: Only exact run-owned legacy shadow resources are permitted.
    - expression: "(object == null ? oldObject : object).spec.name.matches('^legacy_shadow_[a-z0-9_]+_[0-9a-f]{32}$') && size((object == null ? oldObject : object).spec.name) <= 63"
      message: Only exact PostgreSQL shadow database names are permitted.
    - expression: "(object == null ? oldObject : object).spec.cluster.name == 'legacy-postgres-main' && (object == null ? oldObject : object).spec.owner == 'legacy_migration_shadow'"
      message: The cluster and owner are immutable reviewed values.
    - expression: "(object == null ? oldObject : object).metadata.labels['app.kubernetes.io/managed-by'] == 'legacy-maliev-data-migration' && (object == null ? oldObject : object).metadata.labels['maliev.com/database-purpose'] == 'legacy-shadow'"
      message: Required ownership labels are missing.
    - expression: "(object == null ? oldObject : object).metadata.annotations['maliev.com/owner-run-id'].matches('^[0-9a-fA-F-]{36}$') && (object == null ? oldObject : object).metadata.annotations['maliev.com/owner-attempt'].matches('^[1-9][0-9]*$') && (object == null ? oldObject : object).metadata.annotations['maliev.com/fencing-token'].matches('^[0-9a-fA-F-]{36}$')"
      message: Required run, attempt, and fencing annotations are missing.
    - expression: "object == null || oldObject == null || (oldObject.metadata.uid == object.metadata.uid && oldObject.metadata.annotations['maliev.com/owner-run-id'] == object.metadata.annotations['maliev.com/owner-run-id'] && oldObject.metadata.annotations['maliev.com/owner-attempt'] == object.metadata.annotations['maliev.com/owner-attempt'] && oldObject.metadata.annotations['maliev.com/fencing-token'] == object.metadata.annotations['maliev.com/fencing-token'])"
      message: Resource identity and ownership fencing annotations are immutable.
    - expression: "request.operation != 'CREATE' || object.spec.databaseReclaimPolicy == 'delete'"
      message: Shadow creation requires delete reclaim policy.
    - expression: "request.operation != 'UPDATE' || (object.spec.databaseReclaimPolicy == 'delete' && oldObject.spec.databaseReclaimPolicy == 'delete' && oldObject.spec.name == object.spec.name)"
      message: Shadow PostgreSQL names are immutable during updates.
    - expression: "request.operation != 'DELETE' || (oldObject.spec.databaseReclaimPolicy == 'delete' && oldObject.spec.allowConnections == false && oldObject.spec.ensure == 'absent')"
      message: Shadow deletion requires the fenced disabled absent state and delete reclaim policy.
    - expression: "object == null || object.spec.allowConnections == false || (oldObject != null && oldObject.spec.allowConnections == false && object.spec.ensure == 'present') || (request.userInfo.username == 'system:serviceaccount:maliev-legacy:legacy-postgres-main' && oldObject != null && object.spec == oldObject.spec)"
      message: Connections may only be enabled from a fenced disabled resource.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: legacy-data-migration-shadow-databases
spec:
  policyName: legacy-data-migration-shadow-databases
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: maliev-legacy
